<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoreC IDE — Blazingly Fast Language</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #1c2128;
    --fg: #c9d1d9; --fg2: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922;
    --orange: #f0883e; --purple: #bc8cff; --cyan: #39d353;
}
body { background: var(--bg); color: var(--fg); font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }

/* Header */
.header { background: var(--bg2); border-bottom: 1px solid #30363d; padding: 8px 20px; display: flex; align-items: center; gap: 16px; }
.logo { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
.logo span { color: var(--green); }
.header-actions { margin-left: auto; display: flex; gap: 8px; }
.btn { padding: 6px 16px; border: 1px solid #30363d; border-radius: 6px; background: var(--bg3); color: var(--fg); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: 0.15s; }
.btn:hover { border-color: var(--accent); }
.btn-run { background: #238636; border-color: #2ea043; color: white; font-weight: 600; }
.btn-run:hover { background: #2ea043; }
.btn-run:active { transform: scale(0.97); }
.btn-emit { background: #1f2937; border-color: var(--purple); color: var(--purple); }

/* Main layout */
.main { flex: 1; display: flex; overflow: hidden; }
.editor-pane { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #30363d; }
.output-pane { width: 40%; min-width: 300px; display: flex; flex-direction: column; }

/* Tabs */
.tabs { background: var(--bg2); padding: 4px 12px 0; display: flex; gap: 2px; border-bottom: 1px solid #30363d; }
.tab { padding: 6px 14px; font-size: 12px; color: var(--fg2); cursor: pointer; border-radius: 6px 6px 0 0; border: 1px solid transparent; border-bottom: none; }
.tab.active { background: var(--bg); color: var(--fg); border-color: #30363d; }
.tab:hover:not(.active) { color: var(--fg); }

/* Editor */
.editor-wrap { flex: 1; position: relative; overflow: hidden; }
#editor { width: 100%; height: 100%; background: var(--bg); color: var(--fg); border: none; outline: none; padding: 16px; padding-left: 60px; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; font-size: 14px; line-height: 1.6; tab-size: 4; resize: none; white-space: pre; overflow: auto; }
.line-numbers { position: absolute; left: 0; top: 0; width: 48px; height: 100%; background: var(--bg2); color: var(--fg2); font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 14px; line-height: 1.6; padding: 16px 8px; text-align: right; user-select: none; overflow: hidden; border-right: 1px solid #30363d; }

/* Output */
.output-header { background: var(--bg2); padding: 8px 16px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 10px; }
.output-header h3 { font-size: 13px; font-weight: 500; color: var(--fg2); }
.output-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: auto; }
.status-ok { background: #0d1f0d; color: var(--green); border: 1px solid #1b4721; }
.status-err { background: #2d0d0d; color: var(--red); border: 1px solid #5c1a1a; }
.status-running { background: #1a1a0d; color: var(--yellow); border: 1px solid #4d3e0d; }
#output { flex: 1; background: var(--bg); padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; overflow: auto; white-space: pre-wrap; }
.output-error { color: var(--red); }
.output-success { color: var(--green); }
.output-info { color: var(--fg2); }

/* C code view */
#c-output { flex: 1; background: var(--bg); padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; overflow: auto; white-space: pre; color: var(--fg); display: none; }

/* Docs panel */
.docs-panel { display: none; flex: 1; overflow: auto; padding: 20px; }
.docs-panel h2 { color: var(--accent); margin: 16px 0 8px; font-size: 18px; }
.docs-panel h3 { color: var(--green); margin: 12px 0 6px; font-size: 15px; }
.docs-panel p { color: var(--fg2); margin: 4px 0; line-height: 1.5; }
.docs-panel code { background: var(--bg3); padding: 2px 6px; border-radius: 4px; font-family: monospace; color: var(--cyan); }
.docs-panel pre { background: var(--bg2); padding: 12px; border-radius: 8px; margin: 8px 0; overflow-x: auto; border: 1px solid #30363d; }
.docs-panel pre code { background: none; padding: 0; }

/* Examples selector */
.examples-bar { background: var(--bg2); padding: 6px 12px; border-bottom: 1px solid #30363d; display: flex; gap: 6px; align-items: center; }
.examples-bar label { font-size: 12px; color: var(--fg2); }
.examples-bar select { background: var(--bg3); color: var(--fg); border: 1px solid #30363d; border-radius: 4px; padding: 3px 8px; font-size: 12px; }

/* Footer */
.footer { background: var(--bg2); border-top: 1px solid #30363d; padding: 4px 16px; display: flex; justify-content: space-between; font-size: 11px; color: var(--fg2); }

/* Responsive */
@media (max-width: 768px) {
    .main { flex-direction: column; }
    .editor-pane { border-right: none; border-bottom: 1px solid #30363d; }
    .output-pane { width: 100%; height: 40%; }
}
</style>
</head>
<body>

<div class="header">
    <div class="logo">Core<span>C</span></div>
    <div style="font-size:12px; color:var(--fg2);">v0.1 — Blazingly Fast Language</div>
    <div class="header-actions">
        <button class="btn" onclick="showDocs()" id="docs-btn">📖 Docs</button>
        <button class="btn btn-emit" onclick="emitC()">⚙️ View C</button>
        <button class="btn btn-run" onclick="runCode()" id="run-btn">▶ Run</button>
    </div>
</div>

<div class="main">
    <div class="editor-pane">
        <div class="examples-bar">
            <label>📁 Examples:</label>
            <select onchange="loadExample(this.value)" id="example-select">
                <option value="hello">Hello World</option>
                <option value="fibonacci">Fibonacci</option>
                <option value="factorial">Factorial</option>
                <option value="arrays">Arrays & Loops</option>
                <option value="benchmark">Benchmark: Primes</option>
                <option value="guessing">Guessing Game</option>
            </select>
        </div>
        <div class="editor-wrap">
            <div class="line-numbers" id="line-numbers"></div>
            <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
        </div>
    </div>
    <div class="output-pane">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('output')" id="tab-output">Output</div>
            <div class="tab" onclick="switchTab('c-code')" id="tab-ccode">Generated C</div>
            <div class="tab" onclick="switchTab('docs')" id="tab-docs">Docs</div>
        </div>
        <div class="output-header" id="output-header">
            <h3>💻 Program Output</h3>
            <span class="output-status status-ok" id="status">Ready</span>
        </div>
        <div id="output" class="output-info">Press ▶ Run or Ctrl+Enter to compile and run your CoreC program.</div>
        <pre id="c-output"></pre>
        <div class="docs-panel" id="docs-panel"></div>
    </div>
</div>

<div class="footer">
    <span>CoreC Compiler v0.1 | Transpiles to C → gcc -O2 → native binary</span>
    <span>⌨️ Ctrl+Enter = Run | Ctrl+S = Save</span>
</div>

<script>
const EXAMPLES = {
hello: `// CoreC — Hello World
fn main() {
    let name = "World"
    print("Hello, {name}!")
    print("CoreC is blazingly fast 🚀")
}`,

fibonacci: `// CoreC — Fibonacci sequence
fn fibonacci(n: i32) -> i32 {
    if n <= 1 {
        return n
    }
    return fibonacci(n - 1) + fibonacci(n - 2)
}

fn main() {
    print("Fibonacci sequence:")
    for i in [0..20] {
        let result = fibonacci(i)
        print("  fib({i}) = {result}")
    }
}`,

factorial: `// CoreC — Factorial with recursion
fn factorial(n: i32) -> i32 {
    if n <= 1 {
        return 1
    }
    return n * factorial(n - 1)
}

fn main() {
    for i in [1..13] {
        let f = factorial(i)
        print("{i}! = {f}")
    }
}`,

arrays: `// CoreC — Arrays and loops
fn sum_array(arr: [i32], size: i32) -> i32 {
    let mut total = 0
    for i in [0..size] {
        total += arr[i]
    }
    return total
}

fn main() {
    let nums = [10, 20, 30, 40, 50]
    let total = sum_array(nums, 5)
    print("Array: [10, 20, 30, 40, 50]")
    print("Sum = {total}")

    let mut max = 0
    for n in nums {
        if n > max {
            max = n
        }
    }
    print("Max = {max}")
}`,

benchmark: `// CoreC — Benchmark: sum of primes
fn is_prime(n: i32) -> bool {
    if n < 2 {
        return false
    }
    let mut i = 2
    while i * i <= n {
        if n % i == 0 {
            return false
        }
        i += 1
    }
    return true
}

fn main() {
    let mut count = 0
    let mut sum = 0
    for n in [2..100000] {
        if is_prime(n) {
            count += 1
            sum += n
        }
    }
    print("Primes under 100000: {count}")
    print("Sum of primes: {sum}")
}`,

guessing: `// CoreC — Simple math
fn power(base: i32, exp: i32) -> i32 {
    if exp == 0 {
        return 1
    }
    let mut result = 1
    for i in [0..exp] {
        result *= base
    }
    return result
}

fn main() {
    print("Powers of 2:")
    for i in [0..16] {
        let p = power(2, i)
        print("  2^{i} = {p}")
    }
}`
};

const DOCS_HTML = `
<h2>CoreC Language Reference</h2>
<p>CoreC transpiles to C and compiles with gcc -O2. Same speed as C, cleaner syntax.</p>

<h3>Variables</h3>
<pre><code>let x = 42          // immutable, type inferred (i32)
let mut y = 0       // mutable
let name = "Alice"  // string (str)
let pi: f64 = 3.14  // explicit type</code></pre>

<h3>Types</h3>
<p><code>i32</code> <code>i64</code> <code>f32</code> <code>f64</code> <code>bool</code> <code>str</code> <code>void</code></p>

<h3>Functions</h3>
<pre><code>fn add(a: i32, b: i32) -> i32 {
    return a + b
}

fn greet(name: str) {
    print("Hello, {name}!")
}</code></pre>

<h3>Control Flow</h3>
<pre><code>if x > 10 {
    print("big")
} else if x > 5 {
    print("medium")
} else {
    print("small")
}

while x < 100 {
    x += 1
}

for i in [0..10] {
    print("{i}")
}

for item in array {
    print("{item}")
}</code></pre>

<h3>Arrays</h3>
<pre><code>let nums = [1, 2, 3, 4, 5]
let first = nums[0]
for n in nums {
    print("{n}")
}</code></pre>

<h3>String Interpolation</h3>
<pre><code>let name = "World"
let age = 25
print("Hello {name}, age {age}!")</code></pre>

<h3>Operators</h3>
<p>Arithmetic: <code>+</code> <code>-</code> <code>*</code> <code>/</code> <code>%</code></p>
<p>Comparison: <code>==</code> <code>!=</code> <code><</code> <code>></code> <code><=</code> <code>>=</code></p>
<p>Logical: <code>&&</code> <code>||</code> <code>!</code></p>
<p>Assignment: <code>=</code> <code>+=</code> <code>-=</code> <code>*=</code> <code>/=</code></p>

<h3>Built-in Functions</h3>
<p><code>print(args...)</code> — print with newline, supports <code>{var}</code> interpolation</p>

<h3>CLI Usage</h3>
<pre><code>corec build file.crc           # compile to binary
corec run file.crc             # compile and run
corec emit file.crc            # show generated C
corec build file.crc -o out    # custom output name
corec build file.crc --keep-c  # keep .c file</code></pre>
`;

// Init
const editor = document.getElementById('editor');
const output = document.getElementById('output');
const cOutput = document.getElementById('c-output');
const lineNumbers = document.getElementById('line-numbers');
const docsPanel = document.getElementById('docs-panel');
const statusEl = document.getElementById('status');

docsPanel.innerHTML = DOCS_HTML;
editor.value = EXAMPLES.hello;
updateLineNumbers();

// Event listeners
editor.addEventListener('input', updateLineNumbers);
editor.addEventListener('scroll', () => { lineNumbers.scrollTop = editor.scrollTop; });
editor.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        runCode();
    }
    if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(editor.selectionEnd);
        editor.selectionStart = editor.selectionEnd = start + 4;
    }
});

function updateLineNumbers() {
    const lines = editor.value.split('\n').length;
    lineNumbers.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
}

function loadExample(name) {
    editor.value = EXAMPLES[name] || EXAMPLES.hello;
    updateLineNumbers();
}

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    output.style.display = 'none';
    cOutput.style.display = 'none';
    docsPanel.style.display = 'none';
    document.getElementById('output-header').style.display = 'flex';

    if (tab === 'output') {
        document.getElementById('tab-output').classList.add('active');
        output.style.display = 'block';
    } else if (tab === 'c-code') {
        document.getElementById('tab-ccode').classList.add('active');
        cOutput.style.display = 'block';
    } else if (tab === 'docs') {
        document.getElementById('tab-docs').classList.add('active');
        docsPanel.style.display = 'block';
        document.getElementById('output-header').style.display = 'none';
    }
}

function showDocs() { switchTab('docs'); }

function setStatus(text, type) {
    statusEl.textContent = text;
    statusEl.className = 'output-status ' + ({ok:'status-ok', err:'status-err', run:'status-running'}[type] || '');
}

async function runCode() {
    const code = editor.value;
    switchTab('output');
    setStatus('Compiling...', 'run');
    output.textContent = '⏳ Compiling and running...\n';
    output.className = 'output-info';

    try {
        const resp = await fetch('/api/run', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code, action: 'run'})
        });
        const data = await resp.json();

        if (data.success) {
            output.textContent = data.output || '(no output)';
            output.className = 'output-success';
            if (data.time) output.textContent += `\n\n⏱ Execution time: ${data.time}`;
            setStatus('Success', 'ok');
        } else {
            output.textContent = data.error || 'Unknown error';
            output.className = 'output-error';
            setStatus('Error', 'err');
        }
    } catch(e) {
        output.textContent = '❌ Server not available. Run the IDE server:\n\n  cd corec/ide && python3 server.py\n\nOr use the CLI:\n  corec run file.crc';
        output.className = 'output-error';
        setStatus('Offline', 'err');
    }
}

async function emitC() {
    const code = editor.value;
    switchTab('c-code');
    setStatus('Generating C...', 'run');

    try {
        const resp = await fetch('/api/run', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code, action: 'emit'})
        });
        const data = await resp.json();

        if (data.success) {
            cOutput.textContent = data.output;
            setStatus('Generated', 'ok');
        } else {
            cOutput.textContent = data.error || 'Error';
            setStatus('Error', 'err');
        }
    } catch(e) {
        cOutput.textContent = 'Server not available';
        setStatus('Offline', 'err');
    }
}
</script>
</body>
</html>
